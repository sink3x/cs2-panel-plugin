name: build
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build
        run: dotnet publish src/CS2Panel.csproj -c Release -o out
      - name: Package
        run: |
          mkdir -p pkg/CS2Panel
          cp out/CS2Panel.dll pkg/CS2Panel/
          (cd pkg && zip -r ../CS2Panel.zip CS2Panel)
          unzip -l CS2Panel.zip
      - uses: actions/upload-artifact@v4
        with:
          name: CS2Panel
          path: CS2Panel.zip
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: CS2Panel.zip
