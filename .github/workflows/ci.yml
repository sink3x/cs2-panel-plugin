name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Test
        run: dotnet test CS2Panel.sln -c Release
      - name: Build the plugin
        run: dotnet publish src/CS2Panel.csproj -c Release -o out
      - name: Package
        run: |
          mkdir -p pkg/CS2Panel
          cp out/CS2Panel.dll pkg/CS2Panel/
          (cd pkg && zip -r ../CS2Panel.zip CS2Panel)
          unzip -l CS2Panel.zip
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: CS2Panel
          path: CS2Panel.zip
