name: Bug report
description: Something does not work
labels: [bug]
body:
  - type: input
    id: version
    attributes: { label: Plugin version, placeholder: "0.6.0" }
    validations: { required: true }
  - type: input
    id: css
    attributes: { label: CounterStrikeSharp version }
  - type: textarea
    id: what
    attributes: { label: What happened, and what did you expect? }
    validations: { required: true }
  - type: textarea
    id: log
    attributes: { label: Server log lines (remove secrets), render: text }
